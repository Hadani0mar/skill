<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Vaz;src:url(../../assets/fonts/Vazirmatn-VF.ttf);font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:960px;height:600px;overflow:hidden;background:transparent;font-family:Vaz,sans-serif}
#scr{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#1b1426}
.layer{position:absolute;inset:0}
#desk{background:radial-gradient(120% 90% at 70% 10%,#5b3b8c 0%,#2a1b45 45%,#120c1e 100%)}
#menubar{position:absolute;top:0;left:0;right:0;height:30px;background:rgba(20,12,32,.6);display:flex;align-items:center;padding:0 14px;gap:16px;color:#eee;font-size:14px;font-weight:600;z-index:5}
#menubar .r{margin-left:auto;display:flex;gap:14px;align-items:center}
#mbitem{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;font-weight:800}
#mbitem svg{width:16px;height:16px}
.win{position:absolute;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.25);background:#FAF9F5}
.tbar{height:34px;background:#EFEDE6;display:flex;align-items:center;padding:0 12px;gap:7px;border-bottom:1px solid #e2dfd6;position:relative}
.dot{width:12px;height:12px;border-radius:50%}
.tbar .ttl{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:#3d3929}
#claude{left:30px;top:44px;width:900px;height:486px}
#cbody{position:absolute;top:34px;left:0;right:0;bottom:0;display:flex}
#chat{flex:1;position:relative}
#hello{position:absolute;top:120px;left:0;right:0;text-align:center}
#hello img{height:46px}
#input{position:absolute;left:50%;transform:translateX(-50%);width:600px;height:62px;border-radius:18px;background:#fff;border:1px solid #e0ddd3;box-shadow:0 4px 14px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 18px 0 60px;direction:rtl;font-size:19px;font-weight:600;color:#2b2a26;white-space:nowrap;overflow:hidden}
#send{position:absolute;left:12px;top:12px;width:38px;height:38px;border-radius:12px;background:#D97757;display:flex;align-items:center;justify-content:center}
#caret{display:inline-block;width:2px;height:24px;background:#D97757;margin-right:2px;vertical-align:middle}
#umsg{position:absolute;right:30px;top:30px;max-width:420px;background:#EDE9DF;border-radius:16px;padding:10px 16px;font-size:17px;font-weight:600;direction:rtl;color:#2b2a26}
#amsg{position:absolute;right:30px;top:118px;width:400px;direction:rtl;font-size:17px;color:#2b2a26;line-height:1.6}
#amsg img{height:20px;vertical-align:middle;margin-left:8px}
#card{margin-top:12px;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e0ddd3;border-radius:14px;padding:12px 14px}
.appic{width:42px;height:42px;border-radius:11px;background:#16121f;display:flex;align-items:center;justify-content:center}
.appic svg{width:26px;height:26px}
#panel{order:2;width:0;overflow:hidden;border-left:1px solid #e2dfd6;background:#fff;position:relative}
#ptop{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #eee}
#ptitle{font-weight:800;font-size:15px;direction:rtl}
#share{font-size:14px;font-weight:700;padding:5px 12px;border-radius:8px;border:1px solid #ddd;background:#fff}
#menu{position:absolute;top:44px;left:12px;width:200px;background:#fff;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.08);padding:6px}
.mi{padding:9px 12px;border-radius:7px;font-size:15px;font-weight:600;color:#2b2a26}
/* monitor app (dark) */
.mon{background:#16121f;color:#fff;direction:rtl;padding:16px 18px;height:100%}
.mon h4{font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mon h4 span{font-size:12px;color:#7ee2a8;font-weight:700}
.gs{display:flex;gap:12px;justify-content:space-between}
.g{flex:1;background:#221c2e;border-radius:14px;padding:10px 6px;text-align:center}
.g svg{width:86px;height:86px}
.g .lab{font-size:13px;color:#bbb;font-weight:700}
.g .val{font-size:12px;color:#888;direction:ltr}
.rows{margin-top:12px;display:flex;gap:12px}
.rw{flex:1;background:#221c2e;border-radius:12px;padding:9px 12px;display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.rw b{color:#7ee2a8}
#pmon{position:absolute;top:45px;left:0;right:0;bottom:0}
/* popover from the menu bar */
#pop{position:absolute;top:36px;right:150px;width:420px;border-radius:16px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);transform-origin:80% 0}
/* dialog */
#dlg{position:absolute;left:50%;top:50%;width:360px;transform:translate(-50%,-50%);background:#fff;border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.35);padding:22px;text-align:center}
#dlg .appic{width:56px;height:56px;margin:0 auto 10px;border-radius:14px}
#dlg .btns{display:flex;gap:10px;margin-top:16px}
#dlg .btn{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:15px}
#shade{background:rgba(0,0,0,.25)}
/* notification */
#note{position:absolute;top:40px;right:14px;width:330px;background:rgba(40,32,52,.92);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;direction:rtl;color:#fff;box-shadow:0 16px 40px rgba(0,0,0,.4);z-index:6}
#note b{font-size:14px} #note div div{font-size:13px;color:#ddd}
#cursor{position:absolute;width:26px;height:26px;z-index:50}
</style></head>
<body>
<div id="scr">
 <div id="desk" class="layer">
  <div id="menubar"><img src="../../assets/icons/apple-mono.svg" style="height:15px;filter:invert(1)"><span>Finder</span>
   <div class="r"><div id="mbitem"><svg viewBox="0 0 24 24" fill="none" stroke="#7ee2a8" stroke-width="3" stroke-linecap="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span id="mbtxt">RAM 70%</span></div><span>⌕</span><span>11:42</span></div></div>
  <div id="pop"><div class="mon" id="popmon"></div></div>
  <div id="note"><div class="appic"><svg viewBox="0 0 24 24" fill="none" stroke="#7ee2a8" stroke-width="3" stroke-linecap="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></div>
   <div><b>حالة جهازي</b><div id="notetxt">الرام قرب يعبى — 91%</div></div></div>
 </div>
 <div id="claude" class="win">
  <div class="tbar"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div><div class="ttl">Claude</div></div>
  <div id="cbody">
   <div id="panel"><div id="ptop"><div id="share">Share</div><div id="ptitle">حالة جهازي</div></div>
     <div id="pmon"><div class="mon" id="panmon"></div></div>
     <div id="menu"><div class="mi" id="mi1">Install as app</div></div></div>
   <div id="chat">
    <div id="hello"><img src="../../assets/icons/claude-color.svg"></div>
    <div id="umsg"></div>
    <div id="amsg"><div><img src="../../assets/icons/claude-color.svg"><span id="atext"></span></div>
     <div id="card"><div class="appic"><svg viewBox="0 0 24 24" fill="none" stroke="#7ee2a8" stroke-width="3" stroke-linecap="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></div><div><b style="font-size:16px">حالة جهازي</b><div style="font-size:13px;color:#888">Artifact</div></div></div></div>
    <div id="input"><span id="itext"></span><span id="caret"></span>
     <div id="send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div></div>
   </div>
  </div>
  <div id="shade" class="layer"></div>
  <div id="dlg"><div class="appic"><svg viewBox="0 0 24 24" fill="none" stroke="#7ee2a8" stroke-width="3" stroke-linecap="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></div>
   <div style="font-weight:800;font-size:18px;direction:ltr">Install <bdi>حالة جهازي</bdi>?</div>
   <div class="btns"><div class="btn" style="background:#eee">Cancel</div><div class="btn" id="ibtn" style="background:#D97757;color:#fff">Install</div></div></div>
 </div>
 <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 10-7 1.5L9.5 21z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ez=p=>{p=cl(p);return p*p*(3-2*p)};
const back=p=>{p=cl(p);const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const PROMPT='ديرلي برنامج يوريني الرام والتخزين وحالة جهازي';
const REPLY='تمام، هذا «حالة جهازي»:';
// event times (seconds) — overwritten from the voice timing by window.EV
let EV={chat:0,typeA:0.6,typeB:3.0,reply:3.3,card:4.0,panel:4.3,share:7.0,item:7.8,dlg:8.3,install:9.0,desk:9.3,mbitem:9.6,pop:10.6,ram:13.0,note:13.4,end:30};
function ring(p,col){const r=34,c=2*Math.PI*r;return `<svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="${r}" stroke="#332a42" stroke-width="9" fill="none"/>
 <circle cx="43" cy="43" r="${r}" stroke="${col}" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 43 43)"/>
 <text x="43" y="49" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" font-family="Vaz">${Math.round(p*100)}%</text></svg>`}
function mon(el,t,ram){
  const cpu=.18+.08*Math.sin(t*2.3)+.04*Math.sin(t*5.1);
  const rc=ram>.85?'#ff6b6b':'#7ee2a8';
  el.innerHTML=`<h4>حالة جهازي <span>● شغال</span></h4><div class="gs">
   <div class="g">${ring(ram,rc)}<div class="lab">الرام</div><div class="val">${(16*ram).toFixed(1)} / 16 GB</div></div>
   <div class="g">${ring(.67,'#8ab4ff')}<div class="lab">التخزين</div><div class="val">342 / 512 GB</div></div>
   <div class="g">${ring(cpu,'#D97757')}<div class="lab">المعالج</div><div class="val">8 cores</div></div></div>
   <div class="rows"><div class="rw">الحرارة <b>52°</b></div><div class="rw">البطارية <b>86%</b></div></div>`;
}
function show(id,o){const e=$(id);e.style.opacity=o;e.style.display=o<=0.001?'none':''}
function cursor(t,keys){let k=keys.findIndex(k=>k[0]>t);if(k<0)k=keys.length;
  const a=keys[Math.max(0,k-1)],b=keys[Math.min(keys.length-1,k)];const p=b[0]===a[0]?1:ez((t-a[0])/(b[0]-a[0]));
  return [a[1]+(b[1]-a[1])*p,a[2]+(b[2]-a[2])*p]}
function render(t){
  const E=Object.assign({},EV,window.EV||{});
  const desk=t>=E.desk;
  show('claude',desk?0:1);
  const typing=cl((t-E.typeA)/(E.typeB-E.typeA)); const sent=t>=E.typeB;
  $('itext').textContent=sent?'':PROMPT.slice(0,Math.floor(typing*PROMPT.length));
  $('caret').style.opacity=(!sent&&Math.floor(t*2.4)%2==0)?1:0;
  $('input').style.top=(sent?380:230+150*ez((t-E.typeB+.25)/.25))+'px';
  show('hello',sent?0:1); show('umsg',sent?1:0); $('umsg').textContent=PROMPT;
  const st=cl((t-E.reply)/.7); const w=REPLY.split(' ');
  $('atext').textContent=t>E.reply?w.slice(0,Math.ceil(st*w.length)).join(' '):'';
  show('amsg',t>E.reply?1:0); show('card',t>E.card?ez((t-E.card)/.3):0);
  $('panel').style.width=(ez((t-E.panel)/.5)*470)+'px';
  mon($('panmon'),t,.70+.01*Math.sin(t*1.7));
  const menuOn=t>=E.share+.15&&t<E.dlg; show('menu',menuOn?ez((t-E.share-.15)/.15):0);
  $('mi1').style.background=t>E.item?'#F3E3DA':'transparent';
  $('share').style.background=(t>E.share&&t<E.dlg)?'#f1eee6':'#fff';
  const dl=t>=E.dlg&&t<E.install+.25; show('dlg',dl?ez((t-E.dlg)/.15):0); show('shade',dl?.9:0);
  $('dlg').style.transform=`translate(-50%,-50%) scale(${dl?.9+.1*back((t-E.dlg)/.25):1})`;
  $('ibtn').style.filter=(t>E.install&&t<E.install+.18)?'brightness(.85)':'';
  // desktop: menu bar item, popover, rising RAM + notification
  const ram = t<E.ram ? .70+.01*Math.sin(t*1.7) : .70+.21*ez((t-E.ram)/1.0);
  show('mbitem',t>E.mbitem?ez((t-E.mbitem)/.25):0);
  $('mbitem').style.transform=`scale(${t>E.mbitem?back((t-E.mbitem)/.35):0})`;
  $('mbitem').style.background=(t>E.pop-.1)?'rgba(255,255,255,.18)':'transparent';
  $('mbtxt').textContent='RAM '+Math.round(ram*100)+'%';
  show('pop',t>E.pop?ez((t-E.pop)/.2):0);
  $('pop').style.transform=`scale(${t>E.pop?.92+.08*back((t-E.pop)/.3):1})`;
  mon($('popmon'),t,ram);
  show('note',t>E.note?1:0);
  $('note').style.transform=`translateX(${(1-back((t-E.note)/.45))*380}px)`;
  // cursor
  let cx=-60,cy=-60;
  if(!desk&&t>E.share-1.0){[cx,cy]=cursor(t,[[E.share-1.0,620,560],[E.share-.05,500,100],[E.item-.35,500,100],[E.item,560,146],[E.dlg-.1,560,146],[E.install-.1,548,338],[E.desk,548,338]]);}
  if(desk){[cx,cy]=cursor(t,[[E.desk,480,420],[E.pop-.1,800,16],[99,800,16]]);}
  const press=(t>E.share-.05&&t<E.share+.1)||(t>E.dlg-.12&&t<E.dlg+.03)||(t>E.install-.05&&t<E.install+.1)||(t>E.pop-.12&&t<E.pop+.03);
  $('cursor').style.transform=`translate(${cx}px,${cy}px) scale(${press?.82:1})`;
}
window.render=render;
</script></body></html>
