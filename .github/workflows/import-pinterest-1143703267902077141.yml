name: Import Pinterest image 1143703267902077141
on:
  push:
    paths:
      - '.github/workflows/import-pinterest-1143703267902077141.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Pinterest image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib
          folder = Path("skills/techno-ly/brand/pinterest/pin-1143703267902077141")
          folder.mkdir(parents=True, exist_ok=True)
          url = "https://i.pinimg.com/1200x/a3/1e/b1/a31eb154420bfb416e330530177c4b44.jpg"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0", "Referer":"https://www.pinterest.com/"})
          with urllib.request.urlopen(req, timeout=45) as resp:
              data = resp.read(12000000)
              mime = resp.headers.get("Content-Type", "")
          if not data.startswith(b"\xff\xd8\xff") or len(data) < 1024:
              raise RuntimeError(f"Invalid JPEG: mime={mime}, bytes={len(data)}")
          destination = folder / "medical-syringe-1200.jpg"
          destination.write_bytes(data)
          digest = hashlib.sha256(data).hexdigest()
          (folder / "README.md").write_text(
              "# Pinterest image 1143703267902077141\n\n"
              "Original Pinterest link: https://pin.it/32t0uqaQb\n\n"
              "Pin ID: 1143703267902077141\n\n"
              "Direct media source: https://i.pinimg.com/1200x/a3/1e/b1/a31eb154420bfb416e330530177c4b44.jpg\n\n"
              "Saved image: `medical-syringe-1200.jpg`\n\n"
              "SHA-256: `" + digest + "`\n\n"
              "Usage is subject to the image creator's rights and permissions.\n", encoding="utf-8"
          )
          print("Saved verified JPEG",len(data),"bytes; sha256",digest)
          PY
      - name: Commit image to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "skills/techno-ly/brand/pinterest/pin-1143703267902077141"
          if ! git diff --cached --quiet; then
            git commit -m "assets: add Pinterest medical image 1143703267902077141"
            git push origin HEAD:main
          fi
