name: Import Pinterest image 1149473504922409178
on:
  push:
    paths:
      - '.github/workflows/import-pinterest-1149473504922409178.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Pinterest image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib
          folder=Path("skills/techno-ly/brand/pinterest/pin-1149473504922409178")
          folder.mkdir(parents=True,exist_ok=True)
          url="https://i.pinimg.com/1200x/c3/d2/f5/c3d2f55ba0d31ef322cc7f0f1cd53bf1.jpg"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0", "Referer":"https://www.pinterest.com/"})
          with urllib.request.urlopen(req, timeout=40) as response:
              data=response.read(12000000)
              ct=response.headers.get("Content-Type","")
          if not data.startswith(b"\xff\xd8\xff") or len(data)<1024:
              raise RuntimeError(f"Not a valid JPEG: {ct}, {len(data)} bytes")
          (folder/"aesthetic-background-1200.jpg").write_bytes(data)
          (folder/"README.md").write_text(
              "# Pinterest asset: 1149473504922409178\n\n"
              "Source pin: https://pin.it/1ood3FnnO\n\n"
              "Direct image: "+url+"\n\n"
              "File: `aesthetic-background-1200.jpg`\n\n"
              "SHA256: `"+hashlib.sha256(data).hexdigest()+"`\n\n"
              "Use with appropriate rights/attribution.\n",
              encoding="utf-8"
          )
          print("Downloaded JPEG", len(data), hashlib.sha256(data).hexdigest())
          PY
      - name: Commit imported image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/techno-ly/brand/pinterest/pin-1149473504922409178
          if ! git diff --cached --quiet; then
            git commit -m "assets: import Pinterest background pin 1149473504922409178"
            git push origin HEAD:main
          fi
